name: build-feed
on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch:          # manual "Run" button in the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python feeder.py

      - name: commit fresh feed
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@localhost"
          git add -A data
          git commit -m "feed refresh [skip ci]" || echo "nothing new"

      - name: push
        run: git push
